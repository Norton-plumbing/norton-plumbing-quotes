version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://plumber:plumber123@postgres:5432/norton_quotes
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  postgres:
    image: postgres:15-alpine
    container_name: norton-plumbing-db
    environment:
      POSTGRES_USER: plumber
      POSTGRES_PASSWORD: plumber123
      POSTGRES_DB: norton_quotes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumber"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
